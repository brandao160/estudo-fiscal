<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico · Ciclo Estudo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="core.css">
</head>
<body>
    <script id="persistence-data">window.HARDCODED_DATA = null;</script>
    <div id="toast-container"></div>

    <header class="app-header glass-panel">
        <div class="app-header-row">
            <div class="brand">
                <i class="fas fa-book-reader"></i>
                <span>Ciclo de Estudo</span>
            </div>
            <div id="profile-switcher" class="profile-switcher"><!-- JS generated --></div>
        </div>

        <div class="app-header-row">
            <nav class="topnav-menu">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-house"></i>
                    <span>Início</span>
                </a>
                <a href="planejamento.html" class="nav-item">
                    <i class="fas fa-map"></i>
                    <span>Planejamento</span>
                </a>
                <a href="materias.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Matérias</span>
                </a>
                <a href="cicloestudo.html" class="nav-item">
                    <i class="fas fa-bullseye"></i>
                    <span>Ciclo de Estudo</span>
                </a>
                <a href="cicloestudolivre.html" class="nav-item">
                    <i class="fas fa-hand-pointer"></i>
                    <span>Ciclo Livre</span>
                </a>
                <a href="resumo.html" class="nav-item">
                    <i class="fas fa-pencil-alt"></i>
                    <span>Meus Resumos</span>
                </a>
                <a href="listacompleta.html" class="nav-item">
                    <i class="fas fa-list"></i>
                    <span>Lista Completa</span>
                </a>
                <a href="conteudoprogramatico.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Conteúdo Programático</span>
                </a>
                <a href="questoes.html" class="nav-item">
                    <i class="fas fa-list-check"></i>
                    <span>Questões</span>
                </a>
                <a href="tempoestudo.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Tempo de Estudo</span>
                </a>
                <div class="nav-item active">
                    <i class="fas fa-history"></i>
                    <span>Histórico</span>
                </div>
            </nav>
        </div>

        <div class="app-header-row subnav-row">
            <div class="header-stats">
                <div class="header-stat">
                    <div class="header-stat-label">Dias até a Prova</div>
                    <div class="header-stat-value" id="days-left-stat">0</div>
                </div>
                <div class="header-stat">
                    <div class="header-stat-label">Progresso</div>
                    <div class="header-stat-value" id="total-progress-stat">0%</div>
                    <div class="progress-circle">
                        <div class="progress-fill" id="total-progress-bar"></div>
                    </div>
                </div>
                <div class="header-stat">
                    <div class="header-stat-label">Sequência 🔥</div>
                    <div class="header-stat-value" id="streak-stat">0 dias</div>
                </div>
            </div>

            <div style="flex:1;"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="top-bar">
            <div class="page-title">
                <h1 id="page-title-text">Histórico de Estudos</h1>
                <p id="page-subtitle-text">Foco na meta: Ciclo de Estudo</p>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button id="theme-toggle" style="padding: 8px 12px; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;" onclick="toggleTheme()" title="Modo Escuro">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>

        <div class="content-area">
            <div id="view-history" class="view-section active">
                <div style="display:flex; justify-content:flex-end; margin-bottom: 14px;">
                    <button class="btn btn-secondary" onclick="clearStudyHistory()" style="color: var(--red); border-color: rgba(239,68,68,0.3);">
                        <i class="fas fa-trash"></i> Limpar Histórico
                    </button>
                </div>
                <div id="history-container">
                    <!-- JS generated -->
                </div>
            </div>
        </div>
    </main>

    <script src="core.js"></script>
    <script>
        /**
         * Apaga permanentemente o histórico de sessões de estudo (não afeta matérias/ciclo/syllabus).
         */
        function clearStudyHistory() {
            if (studyHistory.length === 0) {
                showToast('O histórico já está vazio.', 'info');
                return;
            }
            if (!confirm('Tem certeza que deseja apagar TODO o histórico de estudos? Essa ação não pode ser desfeita.')) return;
            studyHistory = [];
            localStorage.removeItem(K('estudoFiscalStudyHistory'));
            renderHistory();
            renderTimeStats();
            renderDailyCycle();
            showToast('Histórico de estudos apagado.', 'success');
        }


        function renderHistory() {
            const container = document.getElementById('history-container');
            if(!container) return;
            
            container.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="margin:0; color:var(--accent-color);">Histórico de Estudos</h3>
                    <div style="font-size:0.9rem; color:var(--text-muted);">Total: ${formatTime(studyHistory.reduce((acc, curr) => acc + curr.duration, 0))}</div>
                </div>
            `;
            
            if(studyHistory.length === 0) {
                container.innerHTML += '<div style="text-align:center; color:var(--text-muted); padding:40px;">Nenhum estudo registrado ainda.</div>';
                return;
            }
            
            // Sort by date desc
            const sorted = [...studyHistory].sort((a,b) => new Date(b.date) - new Date(a.date));
            
            const list = document.createElement('div');
            list.className = 'history-list';
            
            sorted.forEach(h => {
                const d = new Date(h.date);
                const item = document.createElement('div');
                item.style.background = 'var(--card-bg)';
                item.style.border = '1px solid var(--border-color)';
                item.style.borderRadius = '8px';
                item.style.padding = '15px';
                item.style.marginBottom = '10px';
                item.style.display = 'flex';
                item.style.justifyContent = 'space-between';
                item.style.alignItems = 'center';
                
                item.innerHTML = `
                    <div>
                        <div style="font-weight:600; color:var(--text-color);">${h.subject}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:4px;">
                            <i class="far fa-calendar"></i> ${d.toLocaleDateString('pt-BR')} 
                            <i class="far fa-clock" style="margin-left:8px;"></i> ${d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}
                        </div>
                        ${h.note ? `<div style="margin-top:8px; font-style:italic; color:#bbb; font-size:0.9rem;">"${h.note}"</div>` : ''}
                    </div>
                    <div style="font-weight:bold; font-size:1.1rem; color:var(--accent-color);">
                        ${formatTime(h.duration)}
                    </div>
                `;
                list.appendChild(item);
            });
            
            container.appendChild(list);
        }



        function init() {
            initCoreData();
            renderHistory();
        }
        initTheme();
        hydrateFromDisk().then(() => { init(); });
    </script>
</body>
</html>
